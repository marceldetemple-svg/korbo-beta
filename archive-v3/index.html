<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korbo</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="korbo-app">
    <section class="start-screen">
      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>

      <header class="brand-row">
        <div class="brand-mark">
          <span></span>
        </div>
        <p>KORBO</p>
      </header>

      <section class="hero">
        <p class="eyebrow">Dein persönlicher Einkaufsassistent</p>

        <h1>
          Dein Einkauf.<br />
          Endlich einfach.
        </h1>

        <p class="hero-text">
          Plane deine Woche, spare Geld und behalte deinen Einkauf im Blick.
          Alles an einem Ort.
        </p>
      </section>

      <section class="promise-card">
        <div class="promise-line"></div>

        <div class="promise-item">
          <span>01</span>
          <p>Korbo lernt, was dir wichtig ist.</p>
        </div>

        <div class="promise-item">
          <span>02</span>
          <p>Korbo erstellt deinen Plan.</p>
        </div>

        <div class="promise-item">
          <span>03</span>
          <p>Du entscheidest, was passt.</p>
        </div>
      </section>

      <section class="action-area">
        <button class="primary-button" type="button">
          Los geht’s
        </button>

        <p>
          Dauert ungefähr eine Minute.
        </p>
      </section>
    </section>
  </main>
</body>
</html>
