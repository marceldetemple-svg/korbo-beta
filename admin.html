<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Korbo Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  padding:20px;
}
.card{
  background:#1d1d1d;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.stat{
  font-size:28px;
  font-weight:bold;
}
img{
  max-width:150px;
  border-radius:10px;
}
table{
  width:100%;
  border-collapse:collapse;
}
td,th{
  border:1px solid #333;
  padding:8px;
}
</style>
</head>
<body>

<h1>Korbo Admin Dashboard</h1>

<div class="card">
<h2>Gesamtbewertungen</h2>
<div id="count" class="stat">0</div>
</div>

<div class="card">
<h2>Durchschnitt Sterne</h2>
<div id="avgStars" class="stat">0</div>
</div>

<div class="card">
<h2>Letzte Bewertungen</h2>
<div id="reviews">Lade...</div>
</div>
  <div class="card">
<h2>Top 10 Rezepte</h2>
<div id="topRecipes">Lade...</div>
</div>

<div class="card">
<h2>Schlechteste Rezepte</h2>
<div id="worstRecipes">Lade...</div>
</div>
<div class="card">
<h2>Meistbewertete Rezepte</h2>
<div id="mostRatedRecipes">Lade...</div>
</div>

<div class="card">
<h2>Meiste Likes</h2>
<div id="mostLikedRecipes">Lade...</div>
</div>

<div class="card">
<h2>Meiste Dislikes</h2>
<div id="mostDislikedRecipes">Lade...</div>
</div>

<div class="card">
<h2>Nutzer-Insights</h2>
<div id="userInsights">Lade...</div>
</div>
<script>

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

loadDashboard();

async function loadDashboard(){

const {data,error} =
await supabaseClient
.from("recipe_votes")
.select("*")
.order("created_at",{ascending:false});

if(error){
document.getElementById("reviews").innerHTML =
error.message;
return;
}

document.getElementById("count").textContent =
data.length;

const stars =
data.filter(x=>x.stars);

const avg =
stars.length
?
(stars.reduce((a,b)=>a+b.stars,0)/stars.length).toFixed(1)
:
0;

document.getElementById("avgStars").textContent =
avg;
  const recipeStats = {};

data.forEach(row => {
  const name = row.recipe_name || "Unbekannt";

  if(!recipeStats[name]){
    recipeStats[name] = {
      name,
      count: 0,
      starsTotal: 0,
      starsCount: 0,
      likes: 0,
      dislikes: 0
    };
  }

  recipeStats[name].count++;

  if(row.stars){
    recipeStats[name].starsTotal += Number(row.stars);
    recipeStats[name].starsCount++;
  }

  if(row.vote === "like") recipeStats[name].likes++;
  if(row.vote === "dislike") recipeStats[name].dislikes++;
});

const rankedRecipes = Object.values(recipeStats)
  .map(r => ({
    ...r,
    avgStars: r.starsCount ? r.starsTotal / r.starsCount : 0
  }))
  .filter(r => r.starsCount > 0);

const topRecipes = [...rankedRecipes]
  .sort((a,b) => b.avgStars - a.avgStars)
  .slice(0,10);

const worstRecipes = [...rankedRecipes]
  .sort((a,b) => a.avgStars - b.avgStars)
  .slice(0,10);

document.getElementById("topRecipes").innerHTML =
renderRecipeRanking(topRecipes);

document.getElementById("worstRecipes").innerHTML =
renderRecipeRanking(worstRecipes);
const mostRatedRecipes = [...rankedRecipes]
  .sort((a,b) => b.count - a.count)
  .slice(0,10);

const mostLikedRecipes = [...rankedRecipes]
  .sort((a,b) => b.likes - a.likes)
  .slice(0,10);

const mostDislikedRecipes = [...rankedRecipes]
  .sort((a,b) => b.dislikes - a.dislikes)
  .slice(0,10);

document.getElementById("mostRatedRecipes").innerHTML =
renderRecipeRanking(mostRatedRecipes);

document.getElementById("mostLikedRecipes").innerHTML =
renderRecipeRanking(mostLikedRecipes);

document.getElementById("mostDislikedRecipes").innerHTML =
renderRecipeRanking(mostDislikedRecipes);

document.getElementById("userInsights").innerHTML =
renderUserInsights(data);
let html =
`
<table>
<tr>
<th>Rezept</th>
<th>Sterne</th>
<th>Kommentar</th>
<th>Bild</th>
</tr>
`;

data.slice(0,50).forEach(row=>{

html += `
<tr>
<td>${row.recipe_name || ""}</td>
<td>${row.stars || ""}</td>
<td>${row.comment || ""}</td>
<td>
${row.image_url
? `<img src="${row.image_url}">`
: "-"
}
</td>
</tr>
`;

});

html += "</table>";

document.getElementById("reviews").innerHTML =
html;

}
function renderRecipeRanking(items){
  if(!items.length){
    return "Noch keine Daten vorhanden.";
  }

  return `
    <table>
      <tr>
        <th>Rezept</th>
        <th>Ø Sterne</th>
        <th>Bewertungen</th>
        <th>Likes</th>
        <th>Dislikes</th>
      </tr>
      ${items.map(item => `
        <tr>
          <td>${item.name}</td>
          <td>${item.avgStars.toFixed(1)}</td>
          <td>${item.count}</td>
          <td>${item.likes}</td>
          <td>${item.dislikes}</td>
        </tr>
      `).join("")}
    </table>
  `;
}
  function renderUserInsights(data){
  const budgets = data
    .map(x => Number(x.budget))
    .filter(x => Number.isFinite(x));

  const avgBudget = budgets.length
    ? (budgets.reduce((a,b)=>a+b,0) / budgets.length).toFixed(2)
    : "0.00";

  const diets = {};
  const goals = {};
  const avoidCounts = {};

  data.forEach(row => {
    if(row.diet){
      diets[row.diet] = (diets[row.diet] || 0) + 1;
    }

    if(row.recipe_goal){
      goals[row.recipe_goal] = (goals[row.recipe_goal] || 0) + 1;
    }

    if(Array.isArray(row.avoid)){
      row.avoid.forEach(item => {
        avoidCounts[item] = (avoidCounts[item] || 0) + 1;
      });
    }
  });

  const topDiet = Object.entries(diets).sort((a,b)=>b[1]-a[1])[0];
  const topGoal = Object.entries(goals).sort((a,b)=>b[1]-a[1])[0];

  const topAvoids = Object.entries(avoidCounts)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10);

  return `
    <table>
      <tr><th>Kennzahl</th><th>Wert</th></tr>
      <tr><td>Durchschnittliches Budget</td><td>${avgBudget} €</td></tr>
      <tr><td>Beliebteste Ernährungsart</td><td>${topDiet ? topDiet[0] + " (" + topDiet[1] + ")" : "-"}</td></tr>
      <tr><td>Häufigstes Ziel</td><td>${topGoal ? topGoal[0] + " (" + topGoal[1] + ")" : "-"}</td></tr>
    </table>

    <h3>Häufigste Ausschlüsse</h3>
    <table>
      <tr><th>Ausschluss</th><th>Anzahl</th></tr>
      ${
        topAvoids.length
        ? topAvoids.map(([name,count]) => `
          <tr>
            <td>${name}</td>
            <td>${count}</td>
          </tr>
        `).join("")
        : `<tr><td colspan="2">Noch keine Daten</td></tr>`
      }
    </table>
  `;
}
</script>

</body>
</html>
