<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korbo</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="korbo-app">

    <section class="welcome-screen">

      <div class="ambient-light"></div>

      <div class="brand">
        <span class="brand-dot"></span>
        <span>KORBO</span>
      </div>

      <div class="welcome-content">
        <p class="eyebrow">Dein persönlicher Einkaufsassistent</p>

        <h1>
          Dein Einkauf.<br />
          Endlich einfach.
        </h1>

        <p class="intro">
          Korbo hilft dir, deine Woche zu planen, Geld zu sparen
          und deinen Einkauf entspannter zu erledigen.
        </p>
      </div>

      <div class="value-list">
        <div>
          <span></span>
          <p>Zeit sparen</p>
        </div>

        <div>
          <span></span>
          <p>Geld sparen</p>
        </div>

        <div>
          <span></span>
          <p>Weniger nachdenken</p>
        </div>
      </div>

      <div class="bottom-action">
        <button type="button">
          Los geht’s
        </button>

        <small>
          Dauert ungefähr 1 Minute.
        </small>
      </div>

    </section>

  </main>
</body>
</html>
