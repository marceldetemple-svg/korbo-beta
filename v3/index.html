<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korbo 3.0</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <section class="hero">
      <div class="brand">KORBO</div>

      <h1>Willkommen bei Korbo 👋</h1>

      <p>
        Dein smarter Einkaufsassistent. Plane deinen Einkauf schneller,
        günstiger und entspannter.
      </p>
    </section>

    <section class="tip-card">
      <div>
        <span class="card-label">🧠 Korbo Tipp</span>
        <h2>Heute könntest du bis zu 8 € sparen.</h2>
        <p>Ich prüfe passende Angebote zu deiner Einkaufsliste.</p>
      </div>

      <button>Mehr erfahren</button>
    </section>

    <section class="actions">
      <button class="action-card primary">
        <span>🍽️</span>
        <div>
          <strong>Essensplan erstellen</strong>
          <small>Ich führe dich Schritt für Schritt zu deinem Wochenplan.</small>
        </div>
      </button>

      <button class="action-card">
        <span>🛒</span>
        <div>
          <strong>Einkaufsliste</strong>
          <small>Produkte ansehen, abhaken oder ergänzen.</small>
        </div>
      </button>

      <button class="action-card">
        <span>💰</span>
        <div>
          <strong>Angebote</strong>
          <small>Spare mit passenden Angeboten in deiner Nähe.</small>
        </div>
      </button>
    </section>

    <section class="recent-card">
      <span>Zuletzt benutzt</span>
      <strong>Vor 4 Tagen geplant</strong>
    </section>

    <nav class="bottom-nav">
      <button class="active">🏠<span>Zuhause</span></button>
      <button>🧭<span>Planen</span></button>
      <button>🛒<span>Einkauf</span></button>
      <button>💰<span>Sparen</span></button>
      <button>👤<span>Profil</span></button>
    </nav>

  </main>
</body>
</html>
