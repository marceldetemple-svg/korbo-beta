<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Korbo 3.0</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <section class="hero">

            <small>KORBO</small>

<h1>Willkommen bei Korbo 👋</h1>

<p>
    Dein smarter Einkaufsassistent.
    Gemeinsam planen wir deinen Einkauf in weniger als einer Minute.
</p>
        </section>

        <button class="action-card primary">

            <span>🍽️</span>

            <strong>Essensplan erstellen</strong>

            <small>
                Ich stelle dir ein paar Fragen und erstelle anschließend deinen Wochenplan.
            </small>

        </button>

        <button class="action-card">

            <span>🛒</span>

            <strong>Einkaufsliste</strong>

            <small>
                Öffne deine Einkaufsliste oder füge neue Produkte hinzu.
            </small>

        </button>

        <button class="action-card">

            <span>💰</span>

            <strong>Angebote entdecken</strong>

            <small>
                Ich suche nach passenden Angeboten zu deiner Einkaufsliste.
            </small>

        </button>

    </div>

</body>

</html>
